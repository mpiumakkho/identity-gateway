spring:
  application:
    name: identity-gateway
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/identity_gateway}
    username: ${POSTGRES_USER:identity_gateway}
    password: ${POSTGRES_PASSWORD:identity_gateway}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8080

management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      enabled: true
    info:
      enabled: true

app:
  cors:
    allowed-origins: http://127.0.0.1:7000,http://localhost:7000