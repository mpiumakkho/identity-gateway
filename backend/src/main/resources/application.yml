spring:
  application:
    name: identity-gateway
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/identity_gateway}
    username: ${POSTGRES_USER:identity_gateway}
    password: ${POSTGRES_PASSWORD:identity_gateway}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8080

management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      enabled: true
      probes:
        enabled: true
      show-details: never
    info:
      enabled: true
    metrics:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

app:
  dopa:
    mode: ${DOPA_MODE:local}
    partner:
      base-url: ${DOPA_BASE_URL:}
      validation-path: ${DOPA_VALIDATION_PATH:/validate}
      api-key: ${DOPA_API_KEY:}
      connect-timeout: ${DOPA_CONNECT_TIMEOUT:PT3S}
      read-timeout: ${DOPA_READ_TIMEOUT:PT10S}
      retry-attempts: ${DOPA_RETRY_ATTEMPTS:1}
  auth:
    session-ttl: PT8H
    hardening:
      lockout:
        enabled: ${AUTH_LOCKOUT_ENABLED:true}
        max-failed-attempts: ${AUTH_LOCKOUT_MAX_FAILED_ATTEMPTS:5}
        duration: ${AUTH_LOCKOUT_DURATION:PT15M}
      password:
        min-length: ${AUTH_PASSWORD_MIN_LENGTH:12}
        max-length: ${AUTH_PASSWORD_MAX_LENGTH:128}
        require-uppercase: ${AUTH_PASSWORD_REQUIRE_UPPERCASE:true}
        require-lowercase: ${AUTH_PASSWORD_REQUIRE_LOWERCASE:true}
        require-digit: ${AUTH_PASSWORD_REQUIRE_DIGIT:true}
        require-special: ${AUTH_PASSWORD_REQUIRE_SPECIAL:false}
      session-cleanup:
        enabled: ${AUTH_SESSION_CLEANUP_ENABLED:true}
        retention: ${AUTH_SESSION_CLEANUP_RETENTION:P30D}
        fixed-delay: ${AUTH_SESSION_CLEANUP_FIXED_DELAY:PT1H}
  bootstrap:
    operator:
      enabled: ${BOOTSTRAP_OPERATOR_ENABLED:false}
      username: ${BOOTSTRAP_OPERATOR_USERNAME:}
      password: ${BOOTSTRAP_OPERATOR_PASSWORD:}
      display-name: ${BOOTSTRAP_OPERATOR_DISPLAY_NAME:Operations User}
      role: ${BOOTSTRAP_OPERATOR_ROLE:OPERATIONS}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://127.0.0.1:7000,http://localhost:7000}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%5p app=${spring.application.name} requestId=%X{requestId:-} thread=%t logger=%logger{36} message=\"%m\"%n%wEx"
